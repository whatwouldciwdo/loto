# Production / Standalone deployment for Ubuntu server.
#
# PostgreSQL (10.8.140.69:5432) and WAHA (10.8.140.67:3010) run externally.
# This compose file builds and runs the Next.js application on port 3009.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: loto-app:latest
    container_name: loto_app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Access the app on host port 3009; app listens on 3000 inside the container
      - "3009:3000"
    volumes:
      # Persist uploaded evidence images across container restarts
      - uploads_data:/app/public/uploads
    networks:
      - loto_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/auth/session"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  uploads_data:
    driver: local

networks:
  loto_network:
    driver: bridge
